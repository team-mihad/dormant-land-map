/* Tooltip */

}

}

:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --ink:#14212E; --mute:#5B6B7A; --line:#DCE2E8;
  --navy:#0F2A3D; --unserv:#C8422B; --serv:#2563A8; --land:#E9EDF0; --shj:#FBF7EE; --shjline:#B8862B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1820; --panel:#15222D; --ink:#E7EDF2; --mute:#9AAAB8; --line:#26394A; --navy:#E7EDF2;
  --unserv:#E8644C; --serv:#5B9BE0; --land:#1B2A36; --shj:#22313D; --shjline:#C79A3E;}}
:root[data-theme="dark"]{--bg:#0E1820; --panel:#15222D; --ink:#E7EDF2; --mute:#9AAAB8; --line:#26394A; --navy:#E7EDF2;
  --unserv:#E8644C; --serv:#5B9BE0; --land:#1B2A36; --shj:#22313D; --shjline:#C79A3E;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14px}
[dir=rtl] body, body[dir=rtl]{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;font-weight:600}
.sub{color:var(--mute);font-size:12.5px;margin-top:2px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:118px}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--mute)}
.kpi.u b{color:var(--unserv)} .kpi.s b{color:var(--serv)}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:5px 14px;cursor:pointer;font:inherit}
.body{display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{background:var(--panel);border-inline-end:1px solid var(--line);overflow:auto;padding:16px}
.sec{margin-bottom:18px}
.sec h2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
[dir=rtl] .sec h2{letter-spacing:0}
label.chk{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.u{background:var(--unserv)} .dot.s{background:var(--serv)}
select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.row{display:flex;gap:6px}
button.btn{font:inherit;border:1px solid var(--navy);background:var(--navy);color:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer}
.msg{font-size:12px;color:var(--mute);min-height:16px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);text-align:start;padding:4px 2px;border-bottom:1px solid var(--line)}
td{padding:5px 2px;border-bottom:1px solid var(--line)}
td.n{text-align:end} tr.ar{cursor:pointer} tr.ar:hover td{background:var(--bg)}
.note{font-size:11.5px;color:var(--mute);line-height:1.5}
#map{height:100%;background:var(--bg)}
.leaflet-container{background:var(--bg);font:inherit}
.alabel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--ink);box-shadow:none;white-space:nowrap}
.alabel b{font-variant-numeric:tabular-nums}
.alabel:before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.pop{font-size:12.5px;line-height:1.55} .pop b{font-size:13px}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.8;color:var(--ink)}
.legend .ln{display:inline-block;width:16px;border-top:2px dashed var(--navy);vertical-align:middle;margin-inline-end:6px}
@media (max-width:760px){.body{grid-template-columns:1fr;grid-template-rows:auto 60vh}aside{max-height:none;border:0}}
</style>
</head>
<body>
<div class="app">
<header>

  pUse:'الاستخدام',pDate:'تاريخ التخصيص',pSize:'المساحة',pServ:'الخدمات',yes:'متوفرة',no:'غير متوفرة',m2:'م²',
  names:{'Al Batayeh':'البطائح','Al Dhaid':'الذيد','Al Hamriyah':'الحمرية','Al Juwaiza':'الجويزع','Al Khan':'الخان','Al Madam':'المدام','Al Nahda':'النهدة','Al Rahmaniya':'الرحمانية','Al Sajaa Industrial':'الصجعة الصناعية','Al Suyoh':'السيوح','Al Tai':'الطي','Dibba Al-Hisn':'دبا الحصن','Kalba':'كلباء','Khor Fakkan':'خورفكان','Muwailih Commercial':'مويلح التجارية'},
  uses:{Residential:'سكني',Commercial:'تجاري',Industrial:'صناعي',Investment:'استثماري',Grant:'منحة','Mixed Use':'متعدد الاستخدام'}}
};
let L_='en';
const fmt=n=>n.toLocaleString('en-US');
const nm=a=>L_==='ar'?(T.ar.names[a]||a):a;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const map=L.map('map',{zoomControl:true,attributionControl:false,preferCanvas:true,minZoom:8,maxZoom:16}).setView([25.25,55.9],9);
const bgLayer=L.geoJSON(D.geo,{style:f=>({color:css('--line'),weight:0.8,fillColor:css('--land'),fillOpacity:1,interactive:false})}).addTo(map);
const outlines={},labels={};
D.areas.forEach(a=>{
  outlines[a.name]=L.polygon(a.poly,{color:css('--navy'),weight:1.4,dashArray:'5 4',fill:true,fillOpacity:0.04,fillColor:css('--navy'),interactive:false}).addTo(map);
  labels[a.name]=L.tooltip({permanent:true,direction:'center',className:'alabel',interactive:false}).setLatLng(a.lab);
});
const gU=L.layerGroup().addTo(map), gS=L.layerGroup().addTo(map); const byId={};
D.pts.forEach(p=>{
  const [id,area,lat,lng,serv,date,use,size]=p;
  const m=L.circleMarker([lat,lng],{radius:4.2,weight:0.8,color:'#fff',fillColor:serv?css('--serv'):css('--unserv'),fillOpacity:0.92});
  m._p=p; (serv?gS:gU).addLayer(m); byId['PLT-SHJ-'+id]=m;
  m.bindPopup(()=>popup(p));
});
function popup(p){const t=T[L_];const [id,area,,,serv,date,use,size]=p;
  return `<div class="pop"><b>PLT-SHJ-${id}</b><br>${nm(area)}<br>${t.pUse}: ${L_==='ar'?(T.ar.uses[use]||use):use}<br>${t.pDate}: ${date}<br>${t.pSize}: ${fmt(size)} ${t.m2}<br>${t.pServ}: <b style="color:${serv?css('--serv'):css('--unserv')}">${serv?t.yes:t.no}</b></div>`;}
const legend=L.control({position:'bottomright'});
legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.id='legend';return d};legend.addTo(map);
function bounds(name){return name?outlines[name].getBounds():L.featureGroup(Object.values(outlines)).getBounds();}
function refresh(){
  const t=T[L_], sel=document.getElementById('area').value, u=document.getElementById('cU').checked, s=document.getElementById('cS').checked;
  [[gU,u,0],[gS,s,1]].forEach(([g,on,sv])=>{g.clearLayers();if(!on)return;D.pts.forEach(p=>{if(p[4]===sv&&(!sel||p[1]===sel))g.addLayer(byId['PLT-SHJ-'+p[0]])})});
  D.areas.forEach(a=>{const vis=!sel||a.name===sel;
    outlines[a.name].setStyle({opacity:vis?1:0.25});
    const n=(u?a.unserv:0)+(s?a.serv:0);
    labels[a.name].setContent(`${nm(a.name)} · <b>${fmt(n)}</b>`);
    if(vis) labels[a.name].addTo(map); else map.removeLayer(labels[a.name]);});
  declutter();
  const A=sel?D.areas.filter(a=>a.name===sel):D.areas;
  let all=A.reduce((x,a)=>x+a.total,0),uu=A.reduce((x,a)=>x+a.unserv,0),ss=A.reduce((x,a)=>x+a.serv,0);
  if(!sel){all=D.totals.all;uu=D.totals.unserv;ss=D.totals.serv;}
  document.getElementById('kAll').textContent=fmt(all);document.getElementById('kU').textContent=fmt(uu);document.getElementById('kS').textContent=fmt(ss);
  document.getElementById('legend').innerHTML=`<div><span class="dot u"></span> ${t.unserv}</div><div><span class="dot s"></span> ${t.serv}</div><div><span class="ln"></span>${t.lgArea}</div>`;
}
function declutter(){
  const placed=[];
  D.areas.slice().sort((a,b)=>b.total-a.total).forEach(a=>{const lb=labels[a.name];const el=lb.getElement&&lb.getElement();if(!el||!map.hasLayer(lb))return;
    el.style.visibility='visible';const r=el.getBoundingClientRect();
    const hit=placed.some(q=>!(r.right+4<q.left||r.left-4>q.right||r.bottom+2<q.top||r.top-2>q.bottom));
    if(hit) el.style.visibility='hidden'; else placed.push(r);});
}
map.on('zoomend moveend',declutter);
function build(){
  const t=T[L_]; document.documentElement.lang=L_; document.documentElement.dir=L_==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.getElementById('lang').textContent=L_==='ar'?'English':'العربية';
  const sel=document.getElementById('area'),cur=sel.value;
  sel.innerHTML=`<option value="">${t.all}</option>`+D.areas.slice().sort((a,b)=>b.total-a.total).map(a=>`<option value="${a.name}">${nm(a.name)}</option>`).join('');
  sel.value=cur;
  document.getElementById('tb').innerHTML=D.areas.slice().sort((a,b)=>b.total-a.total).map(a=>`<tr class="ar" data-a="${a.name}"><td>${nm(a.name)}</td><td class="n"><b>${a.total}</b></td><td class="n" style="color:var(--unserv)">${a.unserv}</td><td class="n" style="color:var(--serv)">${a.serv}</td></tr>`).join('');
  document.querySelectorAll('tr.ar').forEach(r=>r.onclick=()=>{sel.value=r.dataset.a;refresh();map.fitBounds(bounds(sel.value),{padding:[40,40]})});
  document.getElementById('msg').textContent='';
  refresh();
}
document.getElementById('lang').onclick=()=>{L_=L_==='en'?'ar':'en';try{localStorage.setItem('dlm-lang',L_)}catch(e){};build();};
document.getElementById('cU').onchange=refresh;document.getElementById('cS').onchange=refresh;
document.getElementById('area').onchange=e=>{refresh();map.fitBounds(bounds(e.target.value),{padding:[40,40]})};
function find(){const v=document.getElementById('q').value.trim().toUpperCase();const id=/^\d{6}$/.test(v)?'PLT-SHJ-'+v:v.replace(/_/g,'-');const m=byId[id];const t=T[L_];
  if(!m){document.getElementById('msg').textContent=t.notFound;return}
  document.getElementById('area').value='';document.getElementById('cU').checked=true;document.getElementById('cS').checked=true;refresh();
  map.setView(m.getLatLng(),14);m.openPopup();document.getElementById('msg').textContent=t.found;}
document.getElementById('go').onclick=find;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')find()};
try{const s=localStorage.getItem('dlm-lang');if(s==='ar')L_='ar'}catch(e){}
build(); map.fitBounds(bounds(''),{padding:[30,30]});
</script>
</body>
</html>
